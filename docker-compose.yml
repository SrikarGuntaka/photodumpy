name: photo-organizer

# Shared application environment. Anchors keep the api and worker services
# genuinely identical in configuration -- drift between them would produce bugs
# that only appear under `--scale`.
x-app-env: &app-env
  DATABASE_URL: postgres://${POSTGRES_USER:-photo}:${POSTGRES_PASSWORD:-photo}@postgres:5432/${POSTGRES_DB:-photoorganizer}?sslmode=disable
  ENV: ${ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  PHOTO_ROOT: /photos
  THUMBNAIL_DIR: /var/lib/photo-organizer/thumbnails
  # Detection thresholds. Every one is a judgement call rather than a constant
  # of nature, so all are overridable; empty means "use the calibrated default"
  # rather than zero. See DESIGN_DECISIONS.md for how each was arrived at.
  SIMILARITY_THRESHOLD: ${SIMILARITY_THRESHOLD:-}
  CLUSTER_MAX_GAP: ${CLUSTER_MAX_GAP:-}
  CLUSTER_MAX_RADIUS_METERS: ${CLUSTER_MAX_RADIUS_METERS:-}
  # Jobs each worker runs at once. Empty means one per CPU the container sees.
  # Worth setting when scaling workers: every replica defaults to ALL the
  # host's CPUs, so `--scale worker=4` would oversubscribe the machine four
  # times over -- and on 12MP photos, run out of memory first.
  PROCESS_CONCURRENCY: ${PROCESS_CONCURRENCY:-}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-photo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-photo}
      POSTGRES_DB: ${POSTGRES_DB:-photoorganizer}
      # Postgres refuses to initialise a data directory that is not empty; this
      # subdirectory keeps the volume mount point separate from PGDATA, which
      # avoids the classic "lost+found" failure on some volume drivers.
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      # Exposed so you can psql from the host while testing.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # `depends_on: service_healthy` uses this. Without it, the API starts
      # before Postgres accepts connections -- survivable thanks to the retry
      # loop in internal/database, but noisy.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-photo} -d ${POSTGRES_DB:-photoorganizer} -q"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  api:
    build:
      context: .
      target: runtime
      args:
        VERSION: ${VERSION:-dev}
    image: photo-organizer:local
    restart: unless-stopped
    command: ["/app/api"]
    environment:
      <<: *app-env
      HTTP_ADDR: ":8080"
      # The built web UI, served by the API on the same origin. See
      # internal/api/web.go for why same-origin rather than a separate server.
      WEB_DIR: /app/web
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      # READ-ONLY. This is the enforcement point for "never modify, move or
      # delete original photos": even a bug cannot write here.
      - ${HOST_PHOTOS_DIR:-./sample-photos}:/photos:ro
      # Also read-only for the API. Workers generate thumbnails; the API only
      # serves them, and the process that faces HTTP has no reason to be able
      # to write image data anywhere.
      - thumbnails:/var/lib/photo-organizer/thumbnails:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/photo-organizer", "-api", "http://localhost:8080", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    # Consumes the job queue. Scale horizontally with
    # `docker compose up -d --scale worker=N`; every replica claims from the
    # same Postgres queue with FOR UPDATE SKIP LOCKED, so no coordination is
    # needed between them. See PROCESS_CONCURRENCY above before scaling.
    build:
      context: .
      target: runtime
      args:
        VERSION: ${VERSION:-dev}
    image: photo-organizer:local
    restart: unless-stopped
    command: ["/app/worker"]
    environment:
      <<: *app-env
    volumes:
      - ${HOST_PHOTOS_DIR:-./sample-photos}:/photos:ro
      - thumbnails:/var/lib/photo-organizer/thumbnails
    depends_on:
      postgres:
        condition: service_healthy
      # Workers wait for the API because the API owns migrations. Without this,
      # a worker could start against a schema that does not exist yet.
      api:
        condition: service_healthy
    # SIGTERM, not SIGKILL, and enough grace to drain in-flight jobs. Phase 5
    # depends on this: `docker compose stop worker` must be a clean shutdown,
    # while `docker compose kill worker` is the crash we test recovery against.
    stop_signal: SIGTERM
    stop_grace_period: 35s

volumes:
  pgdata:
  thumbnails:
